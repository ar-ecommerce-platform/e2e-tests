name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (compile + test + spotless + checkstyle + jacoco)
        run: ./gradlew build --no-daemon --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run gitleaks via its official image - the marketplace action needs a
      # paid licence for GitHub organisations. Pin the tag once CI is green.
      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest detect --source=/repo --redact --verbose
